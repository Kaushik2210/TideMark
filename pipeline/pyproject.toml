[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidemark"
version = "0.1.0"
description = "Satellite-derived health and encroachment tracking for Bengaluru lakes."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "shapely>=2.0",
  "pyproj>=3.6",
  "requests>=2.31",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "rasterio>=1.3",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
  "beautifulsoup4>=4.12",
  "adlfs>=2024.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
media = ["matplotlib>=3.8", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

[project.scripts]
tidemark-registry = "tidemark.registry:main"
tidemark-water = "tidemark.runner:main"
tidemark-monthly = "tidemark.monthly:main"
tidemark-media = "tidemark.media:main"
tidemark-rainfall = "tidemark.rainfall:main"
tidemark-candidates = "tidemark.candidates:main"
tidemark-anomalies = "tidemark.anomalies:main"
tidemark-ghost = "tidemark.ghost:main"
tidemark-encroach = "tidemark.encroachment:main"
tidemark-validate = "tidemark.validation:main"
tidemark-health = "tidemark.health:main"
tidemark-export = "tidemark.web_export:main"
tidemark-update = "tidemark.update:main"
tidemark-rain-response = "tidemark.rain_response:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long HTML/JSON fixtures
